<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F5 BIG-IP Cookie 解碼器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #cookieInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #cookieInput:focus {
            border-color: #0056b3;
            outline: none;
        }

        #decodeButton {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #decodeButton:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 6px;
            text-align: left;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            line-height: 1.6;
            min-height: 50px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #result.placeholder {
            color: #6c757d;
            font-style: italic;
            /* 為提示文字使用與內文相同的字體，而非等寬字體 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .cookie-examples {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }

        .cookie-examples strong {
            color: #495057;
        }

        .cookie-examples ul {
            padding-left: 20px;
            margin: 8px 0 0 0;
            color: #6c757d;
        }

        .cookie-examples code {
            background-color: #e9ecef;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .result-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .result-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

        .footer a {
            color: #007bff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>F5 BIG-IP Cookie 解碼器</h1>
        <p>輸入 F5 BIG-IP Persistence Cookie 的值 (例如 1677787402.36895.0000) 進行解碼。</p>

        <div class="cookie-examples">
            <strong>常見的 Cookie 名稱與格式：</strong>
            <ul>
                <li>預設格式為 <code>BIGipServer&lt;pool_name&gt;</code>，例如 <code>BIGipServermy_http_pool</code>。</li>
                <li>本工具會自動處理 <code>cookie_name=value</code> 格式，您也可以直接貼上 <code>value</code> 部分。</li>
            </ul>
        </div>

        <div class="input-group">
            <input type="text" id="cookieInput" placeholder="在此貼上 Cookie 值...">
            <button id="decodeButton">解碼</button>
        </div>

        <div id="result" class="placeholder">
            解碼結果將顯示於此。
        </div>

        <div class="footer">
            參考技術文件: <a href="https://my.f5.com/manage/s/article/K6917" target="_blank" rel="noopener noreferrer">F5
                K6917</a>
        </div>
    </div>

    <script>
        const cookieInput = document.getElementById('cookieInput');
        const decodeButton = document.getElementById('decodeButton');
        const resultDiv = document.getElementById('result');

        // 監聽按鈕點擊事件
        decodeButton.addEventListener('click', decodeCookie);

        // 監聽輸入框的 Enter 鍵
        cookieInput.addEventListener('keyup', function (event) {
            if (event.key === 'Enter') {
                decodeCookie();
            }
        });

        function decodeCookie() {
            let rawValue = cookieInput.value.trim();

            // 如果使用者貼上完整的 Cookie (例如 BIGipServerpool_name=value)，只取等號後面的值
            if (rawValue.includes('=')) {
                rawValue = rawValue.split('=')[1];
            }

            if (!rawValue) {
                showError("請輸入 Cookie 值。");
                return;
            }

            const parts = rawValue.split('.');
            if (parts.length < 2) {
                showError("格式無效。Cookie 值應至少包含一個點 ('.')，例如 '1677787402.36895.0000'。");
                return;
            }

            try {
                const encodedIp = parseInt(parts[0], 10);
                const encodedPort = parseInt(parts[1], 10);

                if (isNaN(encodedIp) || isNaN(encodedPort)) {
                    throw new Error("Cookie 值包含非數字部分。");
                }

                // --- 解碼 IP ---
                // 1. 轉為 8 位數的十六進位字串 (32-bit)
                const hexIp = encodedIp.toString(16).padStart(8, '0');
                // 2. 反轉位元組 (byte-swapping)
                const reversedHexIp = hexIp.substring(6, 8) + hexIp.substring(4, 6) + hexIp.substring(2, 4) + hexIp.substring(0, 2);
                // 3. 將每個位元組轉回十進位
                const octets = reversedHexIp.match(/.{1,2}/g).map(octet => parseInt(octet, 16));
                const decodedIp = octets.join('.');

                // --- 解碼 Port ---
                // 1. 轉為 4 位數的十六進位字串 (16-bit)
                const hexPort = encodedPort.toString(16).padStart(4, '0');
                // 2. 反轉位元組
                const reversedHexPort = hexPort.substring(2, 4) + hexPort.substring(0, 2);
                // 3. 轉回十進位
                const decodedPort = parseInt(reversedHexPort, 16);

                showSuccess(`解碼成功！\n\n  - 後端伺服器 IP: ${decodedIp}\n  - 後端伺服器 Port: ${decodedPort}`);

            } catch (error) {
                showError(`解碼失敗: ${error.message}\n請檢查輸入的值是否正確。`);
            }
        }

        function showResult(message, type) { // This function is currently not used, but kept for potential future use.
            resultDiv.textContent = message;
            resultDiv.className = `result-${type}`;
        }

        function showSuccess(message) {
            resultDiv.textContent = message;
            resultDiv.className = 'result-success';
        }

        function showError(message) {
            resultDiv.textContent = message;
            resultDiv.className = 'result-error';
        }
    </script>

</body>

</html>
